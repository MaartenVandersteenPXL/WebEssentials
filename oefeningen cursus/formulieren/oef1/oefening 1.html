<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link href="oef1.css" rel="stylesheet"/>
    <title>gewonnen</title>
</head>
<body>
    <main>
        <h1>
            je hebt gewonnen!
        </h1>
        <h2>
            vul je gegevens in en we sturen de prijs naar jou!
        </h2>
        <form>
            <section>
                <label for="achternaam">Achternaam:</label>
                <input type="text" id ="achternaam" name="achternaam" size="44">
            </section>
            <section>
                <label for="voornaam">Voornaam:</label>
                <input type="text" id ="voornaam" name="voornaam" size="44">
            </section>
            <section>
                <label for="straat">Straat:</label>
                <input type="text" id="straat" name="straat" size="44">
            </section>
            <section>
                <div>
                    <label for="nummer">Nummer:</label>
                    <input type="text" id="nummer" name="huisnummer" maxlength="4" size="7">
                </div>
                <div>
                    <label for="bus">Bus:</label>
                    <input type="text" id="bus" name="busnummer" size="4">
                </div>
            </section>
            <section>
                <label for="postcode">Postcode:</label>
                <input type="text" id="postcode" name="postcode" maxlength="4" size="44">
            </section>
            <section>
                <label for="gemeente">Gemeente:</label>
                <input type="text" id="gemeente" name="gemeente" size="44">
            </section>
            <section class="button">
                <button type="submit">Verzenden</button>
                <button type="reset">Wissen</button>
            </section>
        </form>

    </main>

</body>
</html>
